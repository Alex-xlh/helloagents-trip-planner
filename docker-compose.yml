version: '3.8'

services:
  # 1. PostgreSQL 数据库容器
  postgres:
    image: postgres:15-alpine
    container_name: trip_planner_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: xlh20041109
      POSTGRES_DB: trip_planner
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Redis 消息队列与缓存容器
  redis:
    image: redis:7-alpine
    container_name: trip_planner_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
